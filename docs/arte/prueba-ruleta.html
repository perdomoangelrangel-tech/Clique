<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta en vivo</title>
<!--
  Prototipo de E6 · Arte 3D: la ruleta del dibujo, en 3D, gira y la bola cae en el número que decide el servidor.
  No es parte de la app; E5 la lleva a la pantalla de la ruleta (equipo/contratos/arte3d.md §12 y §13).
  Cómo abrirla: desde la raíz del repositorio, `python -m http.server 8000`
  y luego http://localhost:8000/docs/arte/prueba-ruleta.html (las fuentes de tokens.css se piden en /fonts/, que
  solo existe con `python server.py`: aquí se ven las de respaldo).
  - Las cuentas están en docs/arte/ruleta-animacion.mjs (con su prueba) y el estilo en docs/arte/estilo-toon.mjs.
  - Aquí el número lo elige el navegador, solo para probar; en la app lo manda el servidor (D8).
  - Arranca en 2D y pasa a 3D solo cuando el modelo cargó (ADR-005). Con "menos movimiento", el resultado
    aparece sin animación.
  - Solo dibuja durante una tirada o al cambiar de tamaño: quieta no gasta batería.
  - Para capturas: ?n=17&t=3.1 deja la rueda quieta en ese instante de la tirada del 17.
    ?respaldo=1 dibuja la rueda sola, con fondo transparente, para la versión 2D (static/3d/ruleta-dibujo-2d.webp).
-->
<link rel="stylesheet" href="../../static/css/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--felt); color: var(--text); font: 0.875rem/1.4 var(--f-body); }
  body.stand-in { background: transparent; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 1rem; top: 1rem; padding: 0.75rem 0.875rem; background: var(--card);
    border: 1px solid var(--line-soft); min-width: 14rem; z-index: 1; }
  .hud h1 { margin: 0 0 0.5rem; font: 800 0.95rem/1.2 var(--f-display); }
  .hud dl { display: grid; grid-template-columns: auto auto; gap: 0.125rem 1rem; margin: 0; font-variant-numeric: tabular-nums; }
  .hud dt { color: var(--text-3); }
  .hud dd { margin: 0; text-align: right; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .actions button { flex: 1; padding: 0.5rem; font: 600 0.875rem var(--f-body); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  #spin { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
  .actions button:disabled, .actions button[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
  .actions button:focus-visible, .pick select:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  #result { margin-top: 0.75rem; min-height: 1.4em; font-weight: 600; }
  .pick { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.75rem; color: var(--text-3); }
  .pick small { display: block; font-size: 0.75rem; }
  .pick select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); padding: 0.25rem 0.375rem; }
  #fallback { display: none; position: fixed; inset: 0; place-content: center; padding: 1rem; }
  #fallback img { width: min(80vw, 32rem); height: auto; }
  body.no-3d #scene { display: none; }
  body.no-3d #fallback { display: grid; }
  body.stand-in .hud { display: none; }
  @media (max-width: 37.5rem) { .hud { left: 0.5rem; right: 0.5rem; top: auto; bottom: 0.5rem; min-width: 0; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body class="no-3d">
<canvas id="scene" role="img" aria-label="Ruleta de papel y tinta que gira; la bola cae en el número del resultado"></canvas>
<div id="fallback" role="img" aria-label="Ruleta de papel y tinta"><img src="../../static/3d/ruleta-dibujo-2d.webp" alt=""></div>
<section class="hud" aria-label="Controles de la prueba">
  <h1>Ruleta en vivo · prueba</h1>
  <dl>
    <dt>Cuadros por segundo</dt><dd id="fps">—</dd>
    <dt>Triángulos del modelo</dt><dd id="tris">—</dd>
    <dt>Peso del GLB</dt><dd id="weight">—</dd>
    <dt>Estado</dt><dd id="status" aria-live="polite">Cargando el 3D…</dd>
  </dl>
  <label class="pick" for="number"><span>Número de prueba<small>En la app lo manda el servidor</small></span>
    <select id="number"><option value="random">Al azar</option></select>
  </label>
  <div class="actions">
    <button id="spin" type="button" aria-disabled="true">Girar</button>
    <button id="toggle" type="button" disabled>Ver en 3D</button>
  </div>
  <div id="result" aria-live="polite"></div>
</section>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { planSpin, ballPositionThree, pocketAngle, WHEEL_ORDER, POCKETS } from './ruleta-animacion.mjs';
import { applyToon, addOutlines, modelTriangles } from './estilo-toon.mjs';

const WHEEL_RADIUS = 0.47;       // the rim, in metres
const $ = (id) => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const params = new URLSearchParams(location.search);
const standIn = params.has('respaldo');

let renderer = null, scene, camera, rotor, ball, outline = null, ready = false, running = false, frameId = 0;
let spin = null, spinStart = 0, rotorNow = 0, margin = 1.06;

const setStatus = (t) => { $('status').textContent = t; };
const showing3D = () => !document.body.classList.contains('no-3d');
const spinning = () => !!spin && !spin.finished;
const setSpinEnabled = (on) => $('spin').setAttribute('aria-disabled', on ? 'false' : 'true');

/** The test's "server": a fair number from 0 to 36 picked by the browser. In the app it comes from the server. */
function testNumber() {
  const u = new Uint32Array(1);
  do crypto.getRandomValues(u); while (u[0] >= 4294967296 - (4294967296 % 37));
  return u[0] % 37;
}
/** Which pocket ended under the ball, read from the scene: the check shown on screen. */
function numberUnderBall() {
  const rel = Math.atan2(-ball.position.z, ball.position.x) - rotor.rotation.y;
  let best = null, dist = Infinity;
  for (const n of WHEEL_ORDER) {
    const d = Math.abs(Math.atan2(Math.sin(rel - pocketAngle(n)), Math.cos(rel - pocketAngle(n))));
    if (d < dist) { dist = d; best = n; }
  }
  return best;
}

function pose(s) {
  rotor.rotation.y = s.rotor;
  const p = ballPositionThree(s.ball);
  ball.position.set(p.x, p.y, p.z);
}
function draw() { if (renderer && ready && showing3D()) renderer.render(scene, camera); }

function startSpin() {
  if (!ready || spinning()) return;           // aria-disabled keeps the focus on the button; the guard is here
  const picked = $('number').value;
  const number = picked === 'random' ? testNumber() : Number(picked);
  spin = planSpin({ number, rotorStart: rotorNow });
  spin.finished = false;
  $('result').textContent = 'Girando…';
  setSpinEnabled(false);
  if (reducedMotion.matches || !showing3D()) { finishSpin(); return; }
  spinStart = performance.now();
  startLoop();
}
function finishSpin() {
  pose(spin.at(spin.duration));
  rotorNow = spin.rotorEnd % (2 * Math.PI);
  rotor.rotation.y = rotorNow;
  spin.finished = true;
  const landed = numberUnderBall();
  $('result').textContent = `Número de prueba ${spin.number} · cayó en ${landed}` + (landed === spin.number ? ' ✓' : ' ✗');
  setSpinEnabled(true);
  stopLoop();
  draw();
}

for (let n = 0; n < POCKETS; n++) $('number').add(new Option(String(n), String(n)));
$('spin').addEventListener('click', startSpin);
$('toggle').addEventListener('click', () => {
  if (showing3D()) {
    if (spinning()) finishSpin();
    document.body.classList.add('no-3d'); $('toggle').textContent = 'Ver en 3D';
    setStatus('Versión 2D');
  } else if (ready) {
    document.body.classList.remove('no-3d'); $('toggle').textContent = 'Ver versión 2D';
    if (reducedMotion.matches) setStatus('3D quieto: pediste menos movimiento');
    fit(); draw();
  }
});

try {
  renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: standIn,
    powerPreference: 'high-performance', preserveDrawingBuffer: params.has('t') || standIn });
} catch { renderer = null; }

if (!renderer) {
  setStatus('Sin WebGL: versión 2D');
} else {
  // No lights, no shadows, no environment map: the two tones come from the angle (estilo-toon.mjs)
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene();
  if (standIn) { document.body.classList.add('stand-in'); renderer.setClearColor(0x000000, 0); }
  else scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue('--felt').trim() || 'black');
  camera = new THREE.PerspectiveCamera(32, 1, 0.05, 20);

  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  // Outside the repository (the published prototype) the GLB comes inline in base64
  const fetchModel = window.RULETA_GLB_B64
    ? Promise.resolve(Uint8Array.from(atob(window.RULETA_GLB_B64), (c) => c.charCodeAt(0)).buffer)
    : fetch(new URL('../../static/3d/ruleta.glb', location.href)).then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); });

  fetchModel
    .then((buf) => { $('weight').textContent = (buf.byteLength / 1000).toFixed(1) + ' KB'; return new Promise((ok, fail) => loader.parse(buf, '', ok, fail)); })
    .then((gltf) => {
      scene.add(gltf.scene);
      rotor = gltf.scene.getObjectByName('RIG-ruleta_rotor');
      ball = gltf.scene.getObjectByName('GEO-ruleta_bola');
      if (!rotor || !ball) throw new Error('faltan RIG-ruleta_rotor o GEO-ruleta_bola');
      applyToon(gltf.scene);
      $('tris').textContent = modelTriangles(gltf.scene).toLocaleString('es-MX');
      outline = addOutlines(gltf.scene);
      fit();
      // the ball, in the winning pocket of the last spin: here, the 0 under the marker
      pose(planSpin({ number: 0 }).at(99));
      ready = true;
      setSpinEnabled(true); $('toggle').disabled = false;
      if (standIn || params.has('n') || params.has('t')) {            // capture mode
        const n = standIn && !params.has('n') ? 0 : Number(params.get('n'));
        if (!Number.isInteger(n) || n < 0 || n >= POCKETS) { setStatus('Captura: el número va de 0 a 36'); return; }
        const s = planSpin({ number: n });
        pose(s.at(Number(params.get('t') || 99)));
        document.body.classList.remove('no-3d');
        setStatus('Captura'); fit(); draw();
        window.__pose = (t) => { pose(s.at(t)); renderer.render(scene, camera); };   // to record frame by frame
        window.__listo = true;
        return;
      }
      if (reducedMotion.matches) { setStatus('Versión 2D: pediste menos movimiento'); return; }
      setStatus('3D en vivo');
      document.body.classList.remove('no-3d'); $('toggle').textContent = 'Ver versión 2D';
      fit(); draw();
    })
    .catch((e) => { setStatus('No cargó el modelo: versión 2D'); console.error(e); window.__err = String(e); });

  addEventListener('resize', () => { fit(); if (!running) draw(); });
  fit();
}

function fit() {
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  const portrait = w < h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // from above, nearly like the drawing, at the distance where the whole wheel fits with its line
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const fitAngle = Math.min(vfov, hfov);
  margin = standIn ? 1.1 : portrait ? 1.08 : 1.06;
  const d = (WHEEL_RADIUS / Math.sin(fitAngle / 2)) * margin;
  const elev = THREE.MathUtils.degToRad(portrait && !standIn ? 64 : 60);   // on a phone, higher: the numbers read better
  camera.position.set(0, d * Math.sin(elev), d * Math.cos(elev));
  camera.lookAt(0, 0.04, !standIn && portrait ? 0.26 : 0);                // on a phone the wheel goes up, above the controls
  camera.updateProjectionMatrix();
  if (outline) {
    // the line: 1.1 % of the wheel's width on screen (the drawing uses 2.2 % of the icon), never under 1.5 px
    const wheelPx = (hfov < vfov ? w : h) * Math.sin(fitAngle / 2) / Math.tan(fitAngle / 2) / margin;
    outline.resize(renderer, Math.max(1.5, 0.011 * wheelPx));
  }
}

// The drawing loop runs only during a spin; a still wheel is drawn once (resize, toggle, end of spin).
let frames = 0, t0 = 0;
function startLoop() { if (running || !renderer) return; running = true; frames = 0; t0 = performance.now(); frameId = requestAnimationFrame(frame); }
function stopLoop() {
  if (running && frames > 1) $('fps').textContent = (frames * 1000 / (performance.now() - t0)).toFixed(1) + ' en la tirada';
  running = false; cancelAnimationFrame(frameId);
}
function frame(t) {
  if (!running) return;
  frameId = requestAnimationFrame(frame);
  if (spinning()) {
    const s = spin.at((t - spinStart) / 1000);
    pose(s);
    if (s.done) { finishSpin(); return; }
  }
  renderer.render(scene, camera);
  frames++;
}
</script>
<script>
  // If three.js does not arrive (no network or CDN blocked), the page stays in 2D and says so.
  setTimeout(function () { var e = document.getElementById('status'); if (e.textContent === 'Cargando el 3D…') e.textContent = 'No cargó el 3D: versión 2D'; }, 10000);
</script>
</body>
</html>
