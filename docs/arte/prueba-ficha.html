<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de ficha 3D</title>
<!--
  Página de prueba de OT-006 (E6 · Arte 3D). No es parte de la app.
  Cómo abrirla: desde la raíz del repositorio, `python -m http.server 8000`
  y luego http://localhost:8000/docs/arte/prueba-ficha.html
  Carga static/3d/ficha.glb (meshopt) y pinta cada ficha en tiempo de
  ejecución según equipo/contratos/arte3d.md. Los colores de material y de luz son
  valores de la paleta v2; en la app salen de static/css/tokens.css.
  Arranca en 2D y pasa a 3D solo cuando el modelo cargó (ADR-005): sin WebGL,
  sin red o con "menos movimiento", se queda en 2D.
-->
<style>
  :root { --sala:#0E0C0A; --mesa:#1C1815; --texto:#F2EADB; --texto-3:#A09482; --linea:#3A322A; --oro:#FBB635; --sombra:#000; }
  html, body { margin:0; height:100%; background:var(--sala); color:var(--texto);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #escena { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; left:16px; top:16px; padding:12px 14px; background:var(--mesa);
    border:1px solid var(--linea); box-shadow:4px 4px 0 var(--sombra); min-width:220px; z-index:1; }
  .hud h1 { margin:0 0 8px; font-size:15px; letter-spacing:.02em; }
  .hud dl { display:grid; grid-template-columns:auto auto; gap:2px 16px; margin:0; font-variant-numeric:tabular-nums; }
  .hud dt { color:var(--texto-3); }
  .hud dd { margin:0; text-align:right; }
  .hud button { margin-top:10px; width:100%; padding:8px; background:transparent; color:var(--texto);
    border:1px solid var(--oro); cursor:pointer; font:inherit; }
  .hud button:disabled { opacity:.45; cursor:not-allowed; }
  .hud button:focus-visible { outline:2px solid var(--oro); outline-offset:2px; }
  #respaldo { display:none; position:fixed; inset:0; place-content:center; grid-auto-flow:column; gap:8px; padding:16px; }
  #respaldo img { width:min(22vw,200px); height:auto; }
  body.sin-3d #escena { display:none; }
  body.sin-3d #respaldo { display:grid; }
  @media (max-width: 600px) { #respaldo { grid-auto-flow:row; grid-template-columns:repeat(2, auto); } #respaldo img { width:38vw; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body class="sin-3d">
<canvas id="escena" role="img" aria-label="Cuatro fichas de Clique girando: lima, bermellón, oro y papel"></canvas>
<div id="respaldo" role="img" aria-label="Cuatro fichas de Clique: lima, bermellón, oro y papel">
  <img src="../../static/3d/ficha-lima-2d.webp" alt="">
  <img src="../../static/3d/ficha-bermellon-2d.webp" alt="">
  <img src="../../static/3d/ficha-oro-2d.webp" alt="">
  <img src="../../static/3d/ficha-papel-2d.webp" alt="">
</div>
<section class="hud">
  <h1>Ficha 3D · prueba</h1>
  <dl>
    <dt>Cuadros por segundo</dt><dd id="fps">—</dd>
    <dt>Tiempo por cuadro</dt><dd id="ms">—</dd>
    <dt>Triángulos en escena</dt><dd id="tris">—</dd>
    <dt>Peso del GLB</dt><dd id="peso">—</dd>
    <dt>Estado</dt><dd id="estado" aria-live="polite">Cargando el 3D…</dd>
  </dl>
  <button id="alternar" type="button" disabled>Ver en 3D</button>
</section>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Paleta v2 (equipo/contratos/arte3d.md, secciones 3 y 8): cuerpo e incrustaciones por variante
const VARIANTES = [
  { nombre: 'lima',      cuerpo: 0xC6F432, insertos: 0xEFE6D2 },
  { nombre: 'bermellon', cuerpo: 0xFF4B2B, insertos: 0xEFE6D2 },
  { nombre: 'oro',       cuerpo: 0xFBB635, insertos: 0xEFE6D2 },
  { nombre: 'papel',     cuerpo: 0xEFE6D2, insertos: 0x1A1612 },
];
const LUZ_LLAVE = 0xFFE0B1;   // oro-200
const LUZ_CONTRA = 0xFEECD1;  // oro-100
const $ = (id) => document.getElementById(id);
const boton = $('alternar');
const consultaMovimiento = matchMedia('(prefers-reduced-motion: reduce)');

let renderer = null, escena, camara, listo = false, girando = false, idCuadro = 0;
const fichas = [];

function estado(texto) { $('estado').textContent = texto; }
function en3D() { return !document.body.classList.contains('sin-3d'); }

function mostrar2D() {
  document.body.classList.add('sin-3d');
  detener();
  boton.textContent = 'Ver en 3D';
}
function mostrar3D() {
  if (!listo) return;
  document.body.classList.remove('sin-3d');
  boton.textContent = 'Ver versión 2D';
  arrancar();
}
boton.addEventListener('click', () => (en3D() ? mostrar2D() : mostrar3D()));
consultaMovimiento.addEventListener('change', (e) => {
  if (e.matches) { mostrar2D(); estado('Versión 2D: pediste menos movimiento'); }
});

try {
  renderer = new THREE.WebGLRenderer({ canvas: $('escena'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  renderer = null;
}

if (!renderer) {
  estado('Sin WebGL: versión 2D');
} else {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  escena = new THREE.Scene();
  escena.background = new THREE.Color(0x0E0C0A);
  const pmrem = new THREE.PMREMGenerator(renderer);
  escena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  escena.environmentIntensity = 0.30;
  camara = new THREE.PerspectiveCamera(30, 1, 0.01, 10);
  camara.position.set(0, 0.10, 0.30);
  camara.lookAt(0, 0, 0);
  const llave = new THREE.DirectionalLight(LUZ_LLAVE, 2.6); llave.position.set(-0.4, 0.8, 0.5); escena.add(llave);
  const contra = new THREE.DirectionalLight(LUZ_CONTRA, 1.2); contra.position.set(0.5, 0.3, -0.6); escena.add(contra);

  const url = new URL('../../static/3d/ficha.glb', location.href).href;
  const cargador = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  // Para medir fuera del repositorio se puede incrustar el GLB en base64 (window.FICHA_GLB_B64)
  const traerGLB = window.FICHA_GLB_B64
    ? Promise.resolve(Uint8Array.from(atob(window.FICHA_GLB_B64), (c) => c.charCodeAt(0)).buffer)
    : fetch(url).then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); });

  traerGLB
    .then((buf) => {
      $('peso').textContent = (buf.byteLength / 1000).toFixed(1) + ' KB';
      return new Promise((ok, mal) => cargador.parse(buf, '', ok, mal));
    })
    .then((gltf) => {
      VARIANTES.forEach((v, i) => {
        const f = gltf.scene.clone(true);
        f.traverse((o) => {
          if (!o.isMesh) return;
          o.material = o.material.clone();
          if (o.material.name === 'chip_body') o.material.color.setHex(v.cuerpo);
          if (o.material.name === 'chip_insert') o.material.color.setHex(v.insertos);
        });
        f.position.set((i - 1.5) * 0.048, 0, 0);
        f.rotation.x = 0.55;
        escena.add(f); fichas.push(f);
      });
      listo = true;
      boton.disabled = false;
      if (consultaMovimiento.matches) {
        estado('Versión 2D: pediste menos movimiento');
      } else {
        estado('3D en vivo');
        mostrar3D();
      }
    })
    .catch(() => estado('No cargó el modelo: versión 2D'));

  function ajustar() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camara.aspect = w / h;
    camara.position.z = w < h ? 0.42 : 0.30;
    camara.updateProjectionMatrix();
  }
  addEventListener('resize', ajustar); ajustar();
}

// Medición: promedio de cuadros por segundo en ventanas de 1 s (solo mientras el 3D está a la vista)
const medicion = { fps: 0, ms: 0, muestras: [] };
window.__medicion = medicion;
let cuadros = 0, t0 = 0, tPrev = 0;
function arrancar() {
  if (girando || !renderer) return;
  girando = true; cuadros = 0; t0 = tPrev = performance.now();
  idCuadro = requestAnimationFrame(cuadro);
}
function detener() {
  girando = false;
  cancelAnimationFrame(idCuadro);
}
function cuadro(t) {
  if (!girando) return;
  idCuadro = requestAnimationFrame(cuadro);
  const dt = (t - tPrev) / 1000; tPrev = t;
  if (!consultaMovimiento.matches) for (const f of fichas) f.rotation.y += dt * 0.9;
  renderer.render(escena, camara);
  cuadros++;
  if (t - t0 >= 1000) {
    medicion.fps = cuadros * 1000 / (t - t0);
    medicion.ms = (t - t0) / cuadros;
    medicion.muestras.push(Math.round(medicion.fps * 10) / 10);
    $('fps').textContent = medicion.fps.toFixed(1);
    $('ms').textContent = medicion.ms.toFixed(2) + ' ms';
    $('tris').textContent = renderer.info.render.triangles.toLocaleString('es-MX');
    cuadros = 0; t0 = t;
  }
}
</script>
<script>
  // Si three.js no llega (sin red o CDN bloqueado), la página se queda en 2D y lo dice.
  setTimeout(function () {
    var e = document.getElementById('estado');
    if (e.textContent === 'Cargando el 3D…') e.textContent = 'No cargó el 3D: versión 2D';
  }, 10000);
</script>
</body>
</html>
